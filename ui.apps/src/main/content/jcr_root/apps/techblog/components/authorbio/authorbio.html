<sly data-sly-use.clientlib="core/wcm/components/commons/v1/templates/clientlib.html"/>
<sly data-sly-call="${clientlib.css @ categories='techblog.blog'}"/>
<section class="tb-author">
  <h3>About ${properties.name || 'the author'}</h3>
  <p>${properties.bio}</p>
  <a data-sly-test="${properties.github}" href="${properties.github @ context='uri'}" target="_blank" rel="noopener">GitHub</a>
  <a data-sly-test="${properties.linkedin}" href="${properties.linkedin @ context='uri'}" target="_blank" rel="noopener">LinkedIn</a>
</section>
